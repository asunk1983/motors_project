name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install flask werkzeug openpyxl

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=modules --cov=services --cov=repositories --cov-report=term-missing

      - name: Check Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile modules/backup_system/backup.py
          python -m py_compile modules/auth/auth.py
          python -m py_compile modules/auth/hashing.py
          python -m py_compile modules/auth/db_users.py
          python -m py_compile modules/auth/file_users.py
          python -m py_compile modules/auth/tokens.py
          python -m py_compile modules/auth/decorators.py
          python -m py_compile routes/__init__.py
          python -m py_compile routes/engines.py
          python -m py_compile routes/photos.py
          python -m py_compile routes/import_routes.py
          python -m py_compile routes/export_routes.py
          python -m py_compile routes/backup_routes.py
          python -m py_compile routes/changelog.py
          python -m py_compile schemas/engine_schema.py
          python -m py_compile services/backup_service.py
