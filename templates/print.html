<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Печать паспорта двигателя</title>
    <link rel="stylesheet" href="/static/css/print.css">
</head>
<body>
    <!-- .no-print скрывается в @media print (print.css) — это элементы
         управления самой страницей, а не часть документа для печати. -->
    <div class="print-toolbar no-print">
        <button type="button" class="btn" onclick="window.close()"><span class="icon icon-close"></span> Закрыть</button>
        <button type="button" class="btn btn-primary" id="printBtn"><span class="icon icon-print"></span> Печать / Сохранить PDF</button>
    </div>

    <div id="printRoot">
        <div class="loading">Загрузка данных...</div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/print.js"></script>
</body>
</html>
